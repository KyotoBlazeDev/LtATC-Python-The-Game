name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools and virtual display
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Check Python syntax
        run: python -m compileall -q game lessons sandbox story ui main.py

      - name: Run tests
        run: xvfb-run --auto-servernum python -m pytest -q
