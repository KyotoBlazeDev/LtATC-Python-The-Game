name: Portable Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['TAG']
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?', tag):
              raise SystemExit('Run this workflow on a version tag: vX.Y.Z or vX.Y.Z-alpha.N / beta.N / rc.N')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'tag={tag}\n')
          PY

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - run: python -m pip install pytest==8.4.2
      - name: Check syntax
        run: python -m compileall -q game lessons sandbox story ui main.py release_smoke.py scripts
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest -q
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m pytest -q

  build:
    needs: [validate, test]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Build and verify extracted ZIP
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python scripts/build_portable.py "$env:RELEASE_TAG"
      - name: Retain verified release files
        uses: actions/upload-artifact@v7
        with:
          name: portable-windows
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*-smoke.json
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portable-windows
          path: artifacts
      - name: Verify checksum
        working-directory: artifacts
        run: sha256sum --check *.zip.sha256
      - name: Confirm tag still points to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GH_REPO']
          def request(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          obj = request(f"repos/{repo}/git/ref/tags/{os.environ['RELEASE_TAG']}")['object']
          for _ in range(10):
              if obj['type'] == 'commit':
                  break
              if obj['type'] != 'tag':
                  raise SystemExit('Release tag does not resolve to a commit')
              obj = request(f"repos/{repo}/git/tags/{obj['sha']}")['object']
          if obj['type'] != 'commit' or obj['sha'] != os.environ['EXPECTED_SHA']:
              raise SystemExit('Release tag moved since this workflow started; refusing upload')
          PY
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to replace a published release"'
            gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.zip.sha256 --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.zip.sha256 \
              --verify-tag --draft --generate-notes --title "LtATC $RELEASE_TAG" "${options[@]}"
          fi
