name: Portable Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v0.9.0-beta-4 (blank creates a preview ZIP)"
        required: false
        type: string
      create_draft:
        description: "Create a draft GitHub release after testing (requires version on a branch)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      create_tag: ${{ steps.version.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve version and release intent
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          python - <<'PY'
          import os
          from release_config import resolve_release
          values = resolve_release(os.environ['EVENT'], os.environ['REF_TYPE'], os.environ['TAG'],
              os.environ['VERSION'], os.environ['CREATE_DRAFT'] == 'true', os.environ['GITHUB_RUN_NUMBER'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in values.items():
                  stream.write(f'{key}={value}\n')
          print(f"Version: {values['tag']}; create draft: {values['publish']}")
          PY

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - run: python -m pip install pytest==8.4.2
      - name: Check syntax
        run: python -m compileall -q game lessons sandbox story ui main.py release_smoke.py scripts
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest -q
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m pytest -q

  build:
    needs: [validate, test]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Build and verify extracted ZIP
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python scripts/build_portable.py "$env:RELEASE_TAG"
      - name: Retain verified release files
        uses: actions/upload-artifact@v7
        with:
          name: portable-windows
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*-smoke.json
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portable-windows
          path: artifacts
      - name: Verify checksum
        working-directory: artifacts
        run: sha256sum --check *.zip.sha256
      - name: Confirm or create tag at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          ALLOW_CREATE: ${{ needs.validate.outputs.create_tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request
          repo = os.environ['GH_REPO']
          def request(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          endpoint = f"repos/{repo}/git/ref/tags/{os.environ['RELEASE_TAG']}"
          url = urllib.request.Request('https://api.github.com/' + endpoint,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(url) as response:
                  obj = json.load(response)['object']
          except urllib.error.HTTPError as error:
              if error.code != 404 or os.environ['ALLOW_CREATE'] != 'true':
                  raise
              created = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST',
                  f'repos/{repo}/git/refs', '-f', 'ref=refs/tags/' + os.environ['RELEASE_TAG'],
                  '-f', 'sha=' + os.environ['EXPECTED_SHA']], text=True))
              obj = created['object']
          for _ in range(10):
              if obj['type'] == 'commit':
                  break
              if obj['type'] != 'tag':
                  raise SystemExit('Release tag does not resolve to a commit')
              obj = request(f"repos/{repo}/git/tags/{obj['sha']}")['object']
          if obj['type'] != 'commit' or obj['sha'] != os.environ['EXPECTED_SHA']:
              raise SystemExit('Release tag moved since this workflow started; refusing upload')
          PY
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to replace a published release"'
            gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.zip.sha256 --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.zip.sha256 \
              --verify-tag --draft --generate-notes --title "LtATC $RELEASE_TAG" "${options[@]}"
          fi
